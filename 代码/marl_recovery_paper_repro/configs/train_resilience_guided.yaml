# -*- coding: utf-8 -*-
# 训练配置：Heuristic-Guided Seq-MAPPO（目标1：最大化韧性 / 最小化 RL）

seed: 42

data_dir: data/synth_campus
objective: resilience

control_time: 100.0
threshold_q: 0.8

beta:
  w: 0.55
  p: 0.40
  t: 0.05

ru:
  pipeline: 2
  substation: 1
  bridge: 1

repair_time:
  lognormal_sigma: 0.4
  trunc_low_ratio: 0.1
  trunc_high_ratio: 10.0

train:
  total_env_steps: 500000
  num_envs: 8
  rollout_horizon: 128
  gamma: 0.999
  gae_lambda: 0.95
  ppo_clip: 0.2
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  update_epochs: 4
  minibatch_size: 256
  grad_norm_clip: 0.5

algorithm:
  mode: heuristic_guided
  baseline_policy: importance
  normalize_advantage: true
  entropy_coef_start: 0.01
  entropy_coef_end: 0.0
  actor_lr_end: 1.0e-4
  critic_lr_end: 1.0e-4
  guide:
    imitation_coef_start: 0.20
    imitation_coef_end: 0.0
    handoff_fraction: 0.40

model:
  gnn_hidden: 32
  gnn_out: 1
  mlp_hidden: 128
  mlp_layers: 5

output_dir: outputs/resilience_guided

eval:
  every_iters: 20
  episodes: 5
